<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b16"/>
      <stop offset="50%" stop-color="#14342b"/>
      <stop offset="100%" stop-color="#183f35"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d7f58b"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accentCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7f58b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d7f58b" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="topRightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d6a4f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2d6a4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomLeftGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d7f58b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d7f58b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Smooth Ambient Radial Glows -->
  <circle cx="1020" cy="130" r="360" fill="url(#topRightGlow)"/>
  <circle cx="160" cy="510" r="300" fill="url(#bottomLeftGlow)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#d7f58b" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Brand Header Tag -->
  <g transform="translate(80, 72)">
    <rect width="236" height="42" rx="21" fill="#d7f58b" fill-opacity="0.12" stroke="#d7f58b" stroke-opacity="0.28" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#d7f58b"/>
    <text x="40" y="26" font-family="'Manrope', 'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#d7f58b" letter-spacing="1.2">CANIVETE FINANCEIRO</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 182)">
    <text font-family="'Manrope', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Simuladores &amp;
    </text>
    <text y="66" font-family="'Manrope', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#limeGrad)" letter-spacing="-1">
      Calculadoras Inteligentes
    </text>
    <text y="118" font-family="'DM Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#9bb3a8" letter-spacing="0.2">
      Planejamento patrimonial, metas financeiras e decisões inteligentes em um só lugar.
    </text>
  </g>

  <!-- Feature Tool Cards Grid (2 Rows, 1040px aligned width) -->
  <g transform="translate(80, 346)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect width="220" height="48" rx="14" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="110" y="29" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Juros Compostos</text>
    </g>

    <g transform="translate(236, 0)">
      <rect width="250" height="48" rx="14" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="125" y="29" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Reserva de Emergência</text>
    </g>

    <g transform="translate(502, 0)">
      <rect width="255" height="48" rx="14" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="127.5" y="29" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Imposto de Renda (IRRF)</text>
    </g>

    <g transform="translate(773, 0)">
      <rect width="267" height="48" rx="14" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="133.5" y="29" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Fundos Imobiliários (FIIs)</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 62)">
      <rect width="235" height="48" rx="14" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="117.5" y="29" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Financiamento Price</text>
    </g>

    <g transform="translate(251, 62)">
      <rect width="215" height="48" rx="14" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="107.5" y="29" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Margem de Lucro</text>
    </g>

    <g transform="translate(482, 62)">
      <rect width="205" height="48" rx="14" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="102.5" y="29" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Regra 50/30/20</text>
    </g>

    <g transform="translate(703, 62)">
      <rect width="337" height="48" rx="14" fill="url(#accentCardGrad)" stroke="#d7f58b" stroke-opacity="0.3" stroke-width="1"/>
      <text x="168.5" y="29" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#d7f58b">Gráficos Interativos &amp; Relatórios PDF</text>
    </g>
  </g>

  <!-- Footer Info -->
  <g transform="translate(80, 536)">
    <text font-family="'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#d7f58b">
      arthurrv.me/CaniveteFinanceiro
    </text>
    <text x="1040" text-anchor="end" font-family="'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#7d968b">
      100% Gratuito • Sem Anúncios • Open Source
    </text>
  </g>
</svg>
