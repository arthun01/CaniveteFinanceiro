<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b16"/>
      <stop offset="50%" stop-color="#14342b"/>
      <stop offset="100%" stop-color="#183f35"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d7f58b"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Glow Accents -->
  <circle cx="1050" cy="120" r="220" fill="#2d6a4f" opacity="0.35" filter="url(#glow)"/>
  <circle cx="150" cy="520" r="180" fill="#d7f58b" opacity="0.12" filter="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(215, 245, 139, 0.18)" stroke-width="2"/>

  <!-- Brand Header Tag -->
  <g transform="translate(80, 80)">
    <rect width="260" height="42" rx="21" fill="rgba(215, 245, 139, 0.12)" stroke="rgba(215, 245, 139, 0.25)" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#d7f58b"/>
    <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#d7f58b" letter-spacing="1">CANIVETE FINANCEIRO</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 200)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Simuladores &amp;
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="url(#limeGrad)" letter-spacing="-1">
      Calculadoras Inteligentes
    </text>
    <text y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#9bb3a8" letter-spacing="0.2">
      Planejamento patrimonial, metas financeiras e decisões inteligentes em um só lugar.
    </text>
  </g>

  <!-- Feature Tool Cards Grid -->
  <g transform="translate(80, 390)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="52" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Juros Compostos</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(196, 0)">
      <rect width="215" height="52" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Reserva de Emergência</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(427, 0)">
      <rect width="185" height="52" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Imposto de Renda</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(628, 0)">
      <rect width="215" height="52" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Fundos Imobiliários (FIIs)</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(859, 0)">
      <rect width="180" height="52" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f0fdf4">Tabela Price</text>
    </g>
  </g>

  <!-- Footer Info -->
  <g transform="translate(80, 530)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#d7f58b">
      arthurrv.me/CaniveteFinanceiro
    </text>
    <text x="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#7d968b">
      100% Gratuito • Sem Anúncios • Open Source
    </text>
  </g>
</svg>
